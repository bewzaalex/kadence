# Research: GPU presentation for Kadence, two backends doing the same work (see README.md).
# Build one at a time, so build time and dependencies can be compared:
#   cargo build --release --features wgpu --bin spike-wgpu
#   cargo build --release --features gl   --bin spike-gl
[package]
name = "gpu-spike"
version = "0.0.0"
edition = "2024"
publish = false

[features]
wgpu = ["dep:wgpu", "dep:pollster"]
gl = ["dep:glutin", "dep:glutin-winit", "dep:glow"]

[dependencies]
winit = "0.30"
tiny-skia = "0.11"
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
glow = { version = "0.18", optional = true }

[[bin]]
name = "spike-wgpu"
required-features = ["wgpu"]

[[bin]]
name = "spike-gl"
required-features = ["gl"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
