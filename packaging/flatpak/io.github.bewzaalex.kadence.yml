id: io.github.bewzaalex.kadence
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kadence
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The GPU draws the panel
  - --device=dri
  # Sound output, and the microphone for the Rhythm Coach's Time Check
  - --socket=pulseaudio

modules:
  - name: kadence
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/kadence/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/kadence /app/bin/kadence
      - install -Dm644 assets/io.github.bewzaalex.kadence.desktop /app/share/applications/io.github.bewzaalex.kadence.desktop
      - install -Dm644 assets/io.github.bewzaalex.kadence.metainfo.xml /app/share/metainfo/io.github.bewzaalex.kadence.metainfo.xml
      - install -Dm644 assets/icons/io.github.bewzaalex.kadence.svg /app/share/icons/hicolor/scalable/apps/io.github.bewzaalex.kadence.svg
    sources:
      # The checked-out source: in the release workflow that is the release tag
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - target
          - design/reference
      - cargo-sources.json
