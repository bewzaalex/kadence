[package]
name = "kadence"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A rhythm-trainer metronome with a backlit LCD, rhythm sliders and a clicking tempo dial"
repository = "https://github.com/bewzaalex/kadence"
license = "MIT"

[dependencies]
cpal = "0.18"
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
softbuffer = "0.4"
winit = "0.30"

# Linux: talk to PulseAudio / PipeWire (pipewire-pulse) directly, ALSA stays as the fallback
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

# Linux packages, built by the release workflow (.github/workflows/release.yml)
[package.metadata.deb]
maintainer = "Alex Bevza <bewza_alex@ukr.net>"
copyright = "2026, Alex Bevza <bewza_alex@ukr.net>"
section = "sound"
extended-description = """\
Kadence is a rhythm trainer for practising musicians: a backlit LCD with a swinging pendulum, \
five rhythm sliders, 30 drum patterns, a Rhythm Coach with Time Check through the microphone, \
50 memories with Loop playback, count-in and a reference tone."""
depends = "$auto"
assets = [
    ["target/release/kadence", "usr/bin/", "755"],
    ["assets/io.github.bewzaalex.kadence.desktop", "usr/share/applications/", "644"],
    ["assets/io.github.bewzaalex.kadence.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icons/io.github.bewzaalex.kadence.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/kadence/", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/kadence/OFL-NotoSans.txt", "644"],
]

[package.metadata.generate-rpm]
summary = "Rhythm-trainer metronome"
assets = [
    { source = "target/release/kadence", dest = "/usr/bin/kadence", mode = "755" },
    { source = "assets/io.github.bewzaalex.kadence.desktop", dest = "/usr/share/applications/io.github.bewzaalex.kadence.desktop", mode = "644" },
    { source = "assets/io.github.bewzaalex.kadence.metainfo.xml", dest = "/usr/share/metainfo/io.github.bewzaalex.kadence.metainfo.xml", mode = "644" },
    { source = "assets/icons/io.github.bewzaalex.kadence.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.bewzaalex.kadence.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/kadence/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/kadence/LICENSE", mode = "644", doc = true },
    { source = "assets/fonts/OFL.txt", dest = "/usr/share/licenses/kadence/OFL-NotoSans.txt", mode = "644", doc = true },
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Local softbuffer 0.4.8 with alpha kept on Wayland and macOS (transparent borderless window).
# See vendor/softbuffer/KADENCE-PATCH.md.
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
